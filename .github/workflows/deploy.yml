name: Deploy Frontend

on:
  push:
    branches: [ main ]

concurrency:
  group: deploy-frontend
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script_stop: true
          script: |
            set -e
            export PATH=/root/.nvm/versions/node/v24.21.0/bin:$PATH
            cd /root/leafhomeo-frontend

            git fetch origin
            git reset --hard origin/main

            npm ci
            npm run build

            # build successful hone ke baad hi purani files hatao
            rm -rf /var/www/leafhomoeocare-frontend/*
            cp -r dist/* /var/www/leafhomoeocare-frontend/